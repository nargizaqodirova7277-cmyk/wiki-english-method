name: Website quality check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate learning-path anchors
        run: node scripts/check-anchors.mjs

      - name: Validate HTML structure and links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote

          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = []
                  self.h1 = 0

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == "a": self.links.append(data.get("href"))
                  if tag == "h1": self.h1 += 1
                  if data.get("id"): self.ids.append(data["id"])

          pages = list(Path(".").glob("*.html")) + list(Path("lessons").glob("*.html"))
          broken = []
          for page in pages:
              check = PageCheck()
              check.feed(page.read_text(encoding="utf-8"))
              assert check.h1 == 1, f"{page} must contain exactly one H1"
              assert all(check.links), f"{page} contains an empty link"
              assert len(check.ids) == len(set(check.ids)), f"{page} contains duplicate IDs"
              for link in check.links:
                  target = link.split("#", 1)[0]
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (page.parent / unquote(target)).resolve()
                  if not resolved.exists():
                      broken.append((str(page), target))
          assert not broken, f"Broken website links: {broken}"
          print(f"Validated {len(pages)} HTML pages")
          PY

      - name: Verify generated lesson pages
        run: |
          git clone --depth 1 https://github.com/nargizaqodirova7277-cmyk/wiki-english-method.wiki.git wiki-source
          WIKI_SOURCE=wiki-source python scripts/build_lessons.py
          git diff --exit-code

      - name: Validate Wiki structure
        run: |
          git clone --depth 1 https://github.com/nargizaqodirova7277-cmyk/wiki-english-method.wiki.git wiki-check
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path("wiki-check")
          pages = list(root.glob("*.md"))
          names = {page.stem for page in pages}
          missing = []

          for page in pages:
              text = page.read_text(encoding="utf-8")
              for link in re.findall(r"\[[^]]+\]\(([^)]+)\)", text):
                  target = link.split("#", 1)[0]
                  if target and not target.startswith(("http://", "https://", "mailto:")):
                      if target not in names:
                          missing.append((page.name, target))

          assert not missing, f"Broken Wiki links: {missing}"
          assert not any("YOUR_LEVEL" in page.name for page in pages)
          assert not any("img.shields.io" in page.read_text(encoding="utf-8") for page in pages)
          assert not any(any(ord(char) > 127 for char in page.name) for page in pages)
          print(f"Validated {len(pages)} Wiki pages")
          PY
